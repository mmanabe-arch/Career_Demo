name: Vercel Deploy

on:
  push:
    branches:
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN が未設定のため Vercel デプロイをスキップします。"
            echo "GitHub Secrets に VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID を設定してください。"
            exit 0
          fi
          PROD_FLAG=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PROD_FLAG="--prod"
          fi
          npx vercel --token "$VERCEL_TOKEN" --yes $PROD_FLAG
